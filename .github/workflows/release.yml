name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux-artifacts:
    name: "Linux (musl binary + .deb)"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false

      - uses: "DeterminateSystems/determinate-nix-action@v3"

      - name: "Build glypho (musl static)"
        run: "nix build .#glypho --accept-flake-config"

      - name: "Package binary tarball"
        run: |
          mkdir -p dist
          tar -C result/bin -czf "dist/glypho-x86_64-unknown-linux-musl.tar.gz" glypho

      - name: "Build .deb"
        run: "nix build .#build_deb --accept-flake-config --out-link result-deb"

      - name: "Collect .deb"
        run: "cp result-deb/*.deb dist/"

      - uses: "actions/upload-artifact@v7"
        with:
          name: "linux"
          path: "dist/*"
          if-no-files-found: "error"

  macos-artifacts:
    name: "macOS (native binary)"
    runs-on: "macos-latest"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false

      - uses: "DeterminateSystems/determinate-nix-action@v3"

      - name: "Build glypho"
        run: "nix build .#glypho --accept-flake-config"

      - name: "Package binary tarball"
        run: |
          mkdir -p dist
          tar -C result/bin -czf "dist/glypho-aarch64-apple-darwin.tar.gz" glypho

      - uses: "actions/upload-artifact@v7"
        with:
          name: "macos"
          path: "dist/*"
          if-no-files-found: "error"

  windows-artifacts:
    name: "Windows (.exe)"
    runs-on: "windows-latest"
    steps:
      - uses: "actions/checkout@v6"

      - name: "Install Rust toolchain"
        uses: "dtolnay/rust-toolchain@stable"
        with:
          toolchain: "stable"
          targets: "x86_64-pc-windows-msvc"

      - name: "Install Node.js"
        uses: "actions/setup-node@v8"
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "glypho-web/package-lock.json"

      - name: "Install frontend dependencies"
        working-directory: "glypho-web"
        run: "npm ci"

      - name: "Build release binary"
        run: "cargo build --release --locked --target x86_64-pc-windows-msvc"

      - name: "Package zip"
        shell: "pwsh"
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/x86_64-pc-windows-msvc/release/glypho.exe" -DestinationPath "dist/glypho-x86_64-pc-windows-msvc.zip"

      - uses: "actions/upload-artifact@v7"
        with:
          name: "windows"
          path: "dist/*"
          if-no-files-found: "error"

  publish:
    name: "GitHub release"
    needs:
      - "linux-artifacts"
      - "macos-artifacts"
      - "windows-artifacts"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    # Only tags publish a release; workflow_dispatch is a rehearsal that
    # stops after artifact upload.
    if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: "actions/download-artifact@v7"
        with:
          path: "dist"
          merge-multiple: true

      - name: "Create release"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* \
            --title "Glypho $tag" \
            --generate-notes
