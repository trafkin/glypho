name: "CI"

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  test:
    name: "cargo test (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
    steps:
      - uses: "actions/checkout@v6"

      - name: "Install Rust toolchain"
        uses: "dtolnay/rust-toolchain@stable"
        with:
          toolchain: "stable"

      - name: "Install Node.js"
        uses: "actions/setup-node@v8"
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "glypho-web/package-lock.json"

      - name: "Install frontend dependencies"
        working-directory: "glypho-web"
        run: "npm ci"

      - name: "Run tests"
        run: "cargo test --locked"

  nix-check:
    name: "nix flake check (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false

      - uses: "DeterminateSystems/determinate-nix-action@v3"

      - name: "nix flake check"
        run: "nix flake check --accept-flake-config"
